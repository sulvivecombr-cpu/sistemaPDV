services:
  db:
    image: mysql:8.4
    restart: on-failure
    environment:
      MYSQL_DATABASE: pdv_system
      MYSQL_USER: pdv
      MYSQL_PASSWORD: pdv_local_dev
      MYSQL_ROOT_PASSWORD: pdv_root_local_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
  setup:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment: &database_env
      DB_HOST: db
      DB_NAME: pdv_system
      DB_USER: pdv
      DB_PASSWORD: pdv_local_dev
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "composer install --no-interaction --prefer-dist --no-progress && php .base44/setup.php"]
  web:
    build:
      context: .
      dockerfile: .base44/Dockerfile
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment: *database_env
    env_file:
      - path: /run/base44/app.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: ["sh", "-ec", "exec php -d opcache.enable=0 -S 0.0.0.0:3000 .base44/router.php"]
    healthcheck:
      test: ["CMD", "php", "/app/.base44/healthcheck.php"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  mysql_data:
  vendor:
